# ==============================================================================
# Uncharted Waters: New Horizons — Nginx / PHP-FPM Vhost Configuration
# Target Platform: Hetzner Cloud VPS (Debian 13 Trixie / Ubuntu 24.04 LTS)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name uncharted.yourdomain.com www.uncharted.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uncharted.yourdomain.com www.uncharted.yourdomain.com;

    root /home/uncharted/public_html;
    index index.html index.php;

    # SSL Certificates
    ssl_certificate /home/uncharted/ssl.cert;
    ssl_certificate_key /home/uncharted/ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm image/svg+xml;

    # Static Assets & WASM Tilemap Caching (1 Year Immutable)
    location ~* \.(?:wasm|ogg|png|webp|ico|jpg|jpeg|svg|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PHP API Backend Routing
    location /server/ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust to PHP 8.3 if installed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Single Page Application (SPA) Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/uncharted_access.log;
    error_log /var/log/nginx/uncharted_error.log warn;
}
