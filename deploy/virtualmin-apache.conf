# ==============================================================================
# Uncharted Waters: New Horizons — Virtualmin Apache 2.4+ Vhost Configuration
# Target Platform: Hetzner Cloud VPS (Debian 13 Trixie / Ubuntu 24.04 LTS)
# ==============================================================================

<VirtualHost *:80>
    ServerName uncharted.yourdomain.com
    ServerAlias www.uncharted.yourdomain.com
    DocumentRoot /home/uncharted/public_html

    # Automatically redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName uncharted.yourdomain.com
    ServerAlias www.uncharted.yourdomain.com
    DocumentRoot /home/uncharted/public_html

    # SSL / TLS Configuration (Let's Encrypt managed by Virtualmin / Certbot)
    SSLEngine on
    SSLCertificateFile /home/uncharted/ssl.cert
    SSLCertificateKeyFile /home/uncharted/ssl.key
    SSLCACertificateFile /home/uncharted/ssl.ca
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # Protocols (HTTP/2 enabled for instant multiplexed retro asset loading)
    Protocols h2 http/1.1

    <Directory /home/uncharted/public_html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted

        # --- MIME Types for Retro Web Stack ---
        AddType application/wasm .wasm
        AddType audio/ogg .ogg
        AddType image/webp .webp
        AddType application/json .json

        # --- Gzip / Brotli Deflate Compression ---
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
            AddOutputFilterByType DEFLATE application/javascript application/x-javascript application/json
            AddOutputFilterByType DEFLATE application/wasm
            AddOutputFilterByType DEFLATE image/svg+xml
        </IfModule>

        # --- Browser Caching Policy ---
        <IfModule mod_expires.c>
            ExpiresActive On
            # Immutable 1-year cache for fingerprinted Vite assets & WASM tilemaps
            ExpiresByType application/wasm "access plus 1 year"
            ExpiresByType audio/ogg "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            # HTML and API: Always revalidate
            ExpiresByType text/html "access plus 0 seconds"
            ExpiresByType application/json "access plus 0 seconds"
        </IfModule>

        <IfModule mod_headers.c>
            # Caching Headers
            <FilesMatch "\.(wasm|ogg|png|webp|ico|jpg|jpeg|svg)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            <FilesMatch "\.(html|htm)$">
                Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>

            # Hardened Security Headers
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
            Header set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header set Cross-Origin-Opener-Policy "same-origin"
        </IfModule>

        # --- Single Page Application (SPA) URL Rewriting ---
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Allow direct pass-through for PHP API endpoints in /server
            RewriteCond %{REQUEST_URI} ^/server/ [NC]
            RewriteRule ^ - [L]

            # Serve existing files directly
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Route all other frontend requests to index.html
            RewriteRule ^ index.html [L]
        </IfModule>
    </Directory>

    # PHP-FPM FastCGI Handler (Virtualmin PHP 8.2+ pool)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/php-fpm/uncharted.sock|fcgi://localhost"
    </FilesMatch>

    # Logging
    LogLevel warn
    ErrorLog /home/uncharted/logs/error_log
    CustomLog /home/uncharted/logs/access_log combined
</VirtualHost>
